<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23dc2626'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <!-- Apply the saved theme before the first paint. -->
  <script>
    try { const t = localStorage.getItem('todo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch {}
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- ── Sign in / Create account ─────────────────────────────────────── -->
  <main class="auth" id="auth-view" hidden>
    <div class="auth-box">
      <div class="brand"><span class="brand-mark">T</span> Todo</div>
      <form class="card auth-card" id="auth-form" novalidate>
        <h1 id="auth-title">Sign in</h1>
        <p class="lead" id="auth-lead">Welcome back. Enter your details to see your tasks.</p>
        <div class="alert" id="auth-error" role="alert" hidden></div>
        <div class="row" id="row-name" hidden>
          <label class="label" for="f-name">Name</label>
          <input class="input" id="f-name" name="name" autocomplete="name">
        </div>
        <div class="row">
          <label class="label" for="f-email">Email</label>
          <input class="input" id="f-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="row">
          <label class="label" for="f-password">Password</label>
          <input class="input" id="f-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn-primary" type="submit" id="auth-submit">Sign in</button>
      </form>
      <p class="auth-switch"><span id="switch-text">No account yet?</span> <button class="link" type="button" id="auth-switch">Create one</button></p>
    </div>
  </main>

  <!-- ── App ───────────────────────────────────────────────────────────── -->
  <div class="shell" id="app-view" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span class="brand-mark">T</span> Todo</div>
      <nav class="nav-group" aria-label="Lists">
        <div class="nav-label">Tasks</div>
        <button class="sidebar-item" data-view="all">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>
          All tasks <span class="count" data-count="all"></span>
        </button>
        <button class="sidebar-item" data-view="today">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
          Today <span class="count" data-count="today"></span>
        </button>
        <button class="sidebar-item" data-view="upcoming">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
          Upcoming <span class="count" data-count="upcoming"></span>
        </button>
        <button class="sidebar-item" data-view="done">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/></svg>
          Completed <span class="count" data-count="done"></span>
        </button>
      </nav>
      <div class="sidebar-foot">
        <div class="theme-switch" role="group" aria-label="Theme">
          <button type="button" data-theme-choice="system">System</button>
          <button type="button" data-theme-choice="light">Light</button>
          <button type="button" data-theme-choice="dark">Dark</button>
        </div>
        <div class="user-box">
          <span class="avatar" id="user-avatar"></span>
          <div class="user-meta">
            <div class="user-name" id="user-name"></div>
            <div class="user-email" id="user-email"></div>
          </div>
          <button class="icon-btn" id="logout" title="Sign out" aria-label="Sign out">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></svg>
          </button>
        </div>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <span>Tasks</span><span>/</span><span class="crumb-current" id="crumb"></span>
      </header>

      <div class="content">
        <div class="page-head">
          <div>
            <h1 id="page-title"></h1>
            <p id="page-sub"></p>
          </div>
        </div>

        <form class="add-form" id="add-form">
          <label class="sr-only" for="new-title">New task</label>
          <input class="input input-title" id="new-title" placeholder="Add a task…" maxlength="500" autocomplete="off">
          <label class="sr-only" for="new-due">Due date</label>
          <input class="input input-date tabular" id="new-due" type="date">
          <button class="btn-primary" type="submit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            Add task
          </button>
        </form>

        <section class="card grid-frame" aria-label="Task list">
          <div class="toolbar">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <label class="sr-only" for="search">Search tasks</label>
              <input class="input" id="search" placeholder="Search" autocomplete="off">
              <span class="kbd">Ctrl K</span>
            </div>
            <button class="pill" type="button" id="pill-status">Status <span class="pill-value" id="pill-status-value">Any</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <button class="pill" type="button" id="pill-sort">Sort by <span class="pill-value" id="pill-sort-value">Newest</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <div class="toolbar-right">
              <button class="btn-ghost btn-sm" type="button" id="clear-done">Clear completed</button>
            </div>
          </div>

          <div class="list-head" role="presentation">
            <div></div><div>Task</div><div>Due</div><div class="col-status">Status</div><div></div>
          </div>
          <div id="list" role="list"></div>
          <div class="empty" id="empty" hidden><strong id="empty-title"></strong><span id="empty-text"></span></div>

          <div class="grid-foot">
            <span id="foot-left" class="tabular"></span>
            <span id="foot-right" class="tabular"></span>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
