# Production stack (Coolify). Local development adds docker-compose.override.yml.
# No container names and no published ports: Coolify's Traefik routes the domain to `frontend:4000`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: todo
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      # The api applies backend/schema.sql at startup (Coolify leaves bind-mounted init folders empty).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo -d todo"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://todo:${POSTGRES_PASSWORD:?}@postgres:5432/todo
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PORT: "4000"
      SITE_URL: ${SITE_URL:?}
      API_INTERNAL_URL: http://api:3000
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/healthz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

volumes:
  pgdata:
